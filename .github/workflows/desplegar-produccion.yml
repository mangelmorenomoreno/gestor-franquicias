name: Desplegar API en el VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestor-franquicias-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener versión de producción
        uses: actions/checkout@v4

      - name: Validar secretos y dirección del VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DB_PASSWORD" =~ ^[A-Za-z0-9_-]{20,}$ ]]

      - name: Configurar SSH con verificación del servidor
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Preparar configuración sin incluir secretos en Git
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/entrega/infra/terraform" "$RUNNER_TEMP/entrega/scripts"
          cp infra/terraform/*.tf "$RUNNER_TEMP/entrega/infra/terraform/"
          cp docker-compose.prod.yml "$RUNNER_TEMP/entrega/"
          cp scripts/desplegar-vps.sh "$RUNNER_TEMP/entrega/scripts/"
          {
            printf 'DB_USERNAME=gestor_franquicias\n'
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'IMAGEN_BACKEND=ghcr.io/mangelmorenomoreno/gestor-franquicias:%s\n' "$GITHUB_SHA"
            printf 'PUERTO_API=8088\n'
            printf 'IP_ESCUCHA_API=127.0.0.1\n'
          } > "$RUNNER_TEMP/entrega/.env"
          tar -czf "$RUNNER_TEMP/gestor-franquicias-entrega.tar.gz" -C "$RUNNER_TEMP/entrega" .

      - name: Transferir archivos al VPS mediante SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="$VPS_USER@$VPS_HOST"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" "$remote" \
            'umask 077; mkdir -p "$HOME/.gestor-franquicias-bootstrap"; chmod 700 "$HOME/.gestor-franquicias-bootstrap"'
          scp -q -p -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "$RUNNER_TEMP/gestor-franquicias-entrega.tar.gz" \
            "$remote:.gestor-franquicias-bootstrap/entrega.tar.gz"

      - name: Autenticar GHCR en el VPS si la imagen es privada
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USUARIO: ${{ secrets.GHCR_USUARIO }}
          GHCR_LEER_PAQUETE: ${{ secrets.GHCR_LEER_PAQUETE }}
        run: |
          set -euo pipefail
          if [[ -z "$GHCR_LEER_PAQUETE" ]]; then
            echo "La imagen se descargará sin autenticación de GHCR."
            exit 0
          fi
          [[ "$GHCR_USUARIO" =~ ^[A-Za-z0-9-]+$ ]]
          printf '%s' "$GHCR_LEER_PAQUETE" \
            | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
              "if [ \$(id -u) -eq 0 ]; then docker login ghcr.io -u '$GHCR_USUARIO' --password-stdin; else sudo -n docker login ghcr.io -u '$GHCR_USUARIO' --password-stdin; fi"

      - name: Preparar infraestructura y desplegar la API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -se' <<'DESPLIEGUE_REMOTO'
          set -Eeuo pipefail
          archivo="$HOME/.gestor-franquicias-bootstrap/entrega.tar.gz"
          trap 'rm -f "$archivo"' EXIT
          test -f "$archivo"

          # La contraseña de una base ya inicializada no puede rotarse con POSTGRES_PASSWORD.
          if [[ -f /opt/gestor-franquicias/.env ]]; then
              nueva="$(tar -xOzf "$archivo" ./.env | sed -n 's/^DB_PASSWORD=//p')"
              if [[ "$(id -u)" -eq 0 ]]; then
                  existente="$(sed -n 's/^DB_PASSWORD=//p' /opt/gestor-franquicias/.env)"
              else
                  existente="$(sudo -n sed -n 's/^DB_PASSWORD=//p' /opt/gestor-franquicias/.env)"
              fi
              if [[ "$nueva" != "$existente" ]]; then
                  echo "La contraseña de PostgreSQL difiere de la existente. Deteniendo despliegue." >&2
                  exit 1
              fi
          fi

          if [[ "$(id -u)" -eq 0 ]]; then
              install -d -m 750 /opt/gestor-franquicias
              tar -xzf "$archivo" -C /opt/gestor-franquicias
              chmod 600 /opt/gestor-franquicias/.env
              bash /opt/gestor-franquicias/scripts/desplegar-vps.sh
          else
              sudo -n install -d -m 750 /opt/gestor-franquicias
              sudo -n tar -xzf "$archivo" -C /opt/gestor-franquicias
              sudo -n chmod 600 /opt/gestor-franquicias/.env
              sudo -n bash /opt/gestor-franquicias/scripts/desplegar-vps.sh
          fi
          DESPLIEGUE_REMOTO
