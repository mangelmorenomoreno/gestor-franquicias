name: Desplegar prod en el VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  desplegar:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_desplegar-ambiente.yml
    with:
      ambiente: prod
      rama: main
      puerto: 8088
      entorno_github: produccion
    secrets: inherit
