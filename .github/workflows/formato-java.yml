name: Normalizar formato Java

on:
  push:
    branches:
      - feature/formato-java-legible

permissions:
  contents: write

jobs:
  formato:
    name: Formatear y verificar Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar formato estándar a los archivos Java
        run: mvn -B -ntp com.spotify.fmt:fmt-maven-plugin:2.29:format

      - name: Verificar compilación y pruebas de integración
        run: mvn -B -ntp clean verify

      - name: Registrar normalización de estilo
        run: |
          set -euo pipefail
          git add -u src/main/java src/test/java
          if git diff --cached --quiet; then
            echo "Los fuentes Java ya cumplen el formato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(java): normalizar sangría, saltos de línea y separación de métodos"
          git push origin HEAD:feature/formato-java-legible
