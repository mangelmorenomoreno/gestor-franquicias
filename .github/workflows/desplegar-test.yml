name: Desplegar test en el VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  desplegar:
    if: ${{ github.ref == 'refs/heads/test' }}
    uses: ./.github/workflows/_desplegar-ambiente.yml
    with:
      ambiente: test
      rama: test
      puerto: 8087
      entorno_github: pruebas
    secrets: inherit
