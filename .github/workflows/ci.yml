name: Validación backend
on:
  push:
    branches: [dev, test, stage, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas unitarias e integración
        run: mvn -B --no-transfer-progress clean verify
      - name: Validar construcción de Docker
        if: success()
        run: docker build -t gestor-franquicias:validacion .
