name: Validación backend

on:
  push:
    branches: [dev, test, stage, main, 'feature/**', 'bugfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Compilar, probar y construir contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validar compilación, pruebas y migraciones
        run: mvn -B --no-transfer-progress clean verify

      - name: Preparar JAR validado para Docker
        run: |
          mkdir -p empaquetado
          cp target/gestor-franquicias-0.0.1-SNAPSHOT.jar empaquetado/gestor-franquicias.jar

      - name: Construir imagen Docker sin descargar dependencias nuevamente
        run: docker build -f Dockerfile.runtime -t gestor-franquicias:validacion .

      - name: Validar conexiones PostgreSQL y Flyway con cada perfil
        run: |
          for ambiente in dev test stage prod; do
            echo "=== Comprobando perfil $ambiente con su propia base ==="
            PERFIL="$ambiente" bash scripts/validar-contenedor.sh
          done

      - name: Comprobar sintaxis del despliegue automatizado
        run: |
          bash -n scripts/desplegar-vps.sh
          bash -n scripts/validar-contenedor.sh
          # Evitar regresión: apt debe leer la clave pública incluso con umask 077.
          grep -Fq 'chmod 0644 "$keyring"' scripts/desplegar-vps.sh
          # Evitar la regresión: el keyring preexistente debe repararse antes de apt-get update.
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/desplegar-vps.sh").read_text()
          inicio = script.index("if ! command -v terraform")
          primera_actualizacion = script.index("  apt-get update", inicio)
          reparacion = script.index("    chmod 0644 \"$keyring\"", inicio)
          assert reparacion < primera_actualizacion
          PY
          # Evitar desplegar al abrir PR o desde ramas distintas de main.
          grep -Fq 'needs: publicar' .github/workflows/publicar-imagen.yml
          grep -Fq "github.event.workflow_run.head_branch == 'main'" .github/workflows/publicar-imagen.yml
          grep -Fq 'revision: ${{ github.event.workflow_run.head_sha }}' .github/workflows/publicar-imagen.yml
          for ambiente in dev test stage prod; do
            test -f "src/main/resources/application-$ambiente.yml"
            test -f "docker-compose.$ambiente.yml"
          done

      - name: Validar configuración de Docker Compose
        env:
          DB_USERNAME: gestor_franquicias
          DB_PASSWORD: CLAVE_TEMPORAL_DE_VALIDACION
          IMAGEN_BACKEND: gestor-franquicias:validacion
        run: |
          docker compose -f docker-compose.yml config -q
          for ambiente in dev test stage prod; do
            echo "Validando Docker Compose: $ambiente"
            docker compose -f "docker-compose.$ambiente.yml" config -q
          done

  infraestructura:
    name: Validar Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar los proveedores
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Validar configuración de infraestructura
        run: terraform -chdir=infra/terraform validate -no-color
