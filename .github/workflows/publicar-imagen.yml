name: Publicar imagen Docker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validación backend"]
    types: [completed]
    branches: [dev, test, stage, main]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["dev","test","stage","main"]'), github.ref_name)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código verificado por CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar pruebas antes de una publicación manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: mvn -B --no-transfer-progress clean verify

      - name: Construir el JAR de la versión verificada
        run: |
          mvn -B --no-transfer-progress -DskipTests package
          mkdir -p empaquetado
          cp target/gestor-franquicias-0.0.1-SNAPSHOT.jar empaquetado/gestor-franquicias.jar

      - name: Preparar etiquetas inmutables por commit
        id: etiquetas
        env:
          RAMA: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
          SHA_VALIDADO: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "version=ghcr.io/$REPO:$SHA_VALIDADO" >> "$GITHUB_OUTPUT"
          if [[ "$RAMA" == main ]]; then
            echo "latest=ghcr.io/$REPO:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen de la rama validada
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ${{ steps.etiquetas.outputs.version }}
            ${{ steps.etiquetas.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar_produccion:
    name: Desplegar producción tras publicar imagen verificada
    needs: publicar
    # Un PR abierto o un CI de dev/test/stage NUNCA despliega.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && needs.publicar.result == 'success' }}
    uses: ./.github/workflows/_desplegar-ambiente.yml
    with:
      ambiente: prod
      rama: main
      puerto: 8088
      entorno_github: produccion
      revision: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  reportar_resultado:
    name: Registrar resultado de despliegue por commit
    needs: [publicar, desplegar_produccion]
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publicar estado verificado de producción
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA_VALIDADO: ${{ github.event.workflow_run.head_sha }}
          RESULTADO_PUBLICAR: ${{ needs.publicar.result }}
          RESULTADO_DESPLEGAR: ${{ needs.desplegar_produccion.result }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          estado=failure
          descripcion="Publicacion, despliegue o API publica sin verificar"
          if [[ "$RESULTADO_PUBLICAR" == success && "$RESULTADO_DESPLEGAR" == success ]]; then
            estado=success
            descripcion="API, OpenAPI y Swagger comprobados desde Internet"
          fi
          cuerpo="$(ESTADO="$estado" DESCRIPCION="$descripcion" python3 -c 'import json,os; print(json.dumps({"state":os.environ["ESTADO"],"context":"produccion/swagger-publico","description":os.environ["DESCRIPCION"],"target_url":os.environ["URL_EJECUCION"]}))')"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST -d "$cuerpo" \
            "https://api.github.com/repos/$REPO/statuses/$SHA_VALIDADO" >/dev/null
          echo "Resultado asociado al commit $SHA_VALIDADO: $estado"
